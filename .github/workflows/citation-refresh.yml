name: Citation refresh

# Keeps the citation sentence on the home page current, every three months.
#
# When the numbers differ, the workflow pushes a branch with the new sentence
# and opens a PR for review. Where the repository does not let a workflow open
# a PR, it opens an issue that links the branch. The workflow never commits to
# main.
#
# Google Scholar refuses some requests from the runners of GitHub. A refused
# run opens a reminder issue, and the counts are then read by the
# refresh-citations skill from a personal machine.

on:
  schedule:
    # 16:00 UTC on the first day of January, April, July, and October
    - cron: "0 16 1 1,4,7,10 *"
  workflow_dispatch:
  # A PR that changes the workflow or the script runs the tests. They use
  # saved pages, so a PR sends no request to Google Scholar.
  pull_request:
    paths:
      - ".github/workflows/citation-refresh.yml"
      - ".claude/skills/refresh-citations/scripts/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the tests of the script
        run: python3 -m unittest discover -v -s .claude/skills/refresh-citations/scripts -p "test_*.py"

  refresh:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # The branch of the change starts from main, also when the run was
      # started by hand from another branch.
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compare the sentence with Google Scholar
        id: compare
        run: |
          set +e
          python3 .claude/skills/refresh-citations/scripts/refresh_citations.py --write > report.txt 2> error.txt
          status=$?
          set -e
          cat report.txt
          cat error.txt >&2
          case "$status" in
            0) outcome=current ;;
            1) outcome=changed ;;
            3) outcome=refused ;;
            4) outcome=lower ;;
            *) outcome=failed ;;
          esac
          # A changed outcome must change one line of the page, and no other
          # outcome may change the page.
          changed_lines=$(git diff --numstat -- index.md | awk '{print $1 "+" $2}')
          if [ "$outcome" = "changed" ] && [ "$changed_lines" != "1+1" ]; then
            echo "The page differs by \"$changed_lines\" lines, and one line was expected." >> error.txt
            outcome=failed
          fi
          if [ "$outcome" != "changed" ] && [ -n "$changed_lines" ]; then
            echo "The page changed although the outcome was $outcome." >> error.txt
            outcome=failed
          fi
          echo "Outcome: $outcome"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Push the branch and open the PR
        if: steps.compare.outputs.outcome == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          branch="refresh-citation-stats-$(date -u +%Y-%m)"
          title="Refresh citation statistics on the home page"
          ready="Citation refresh: a branch is ready for a PR"
          link="Open the PR here: $REPO_URL/compare/main...$branch?expand=1"
          # Opens the issue on the branch, or adds a comment to the open one.
          report_branch() {
            number=$(gh issue list --state open --search "in:title \"$ready\"" --json number,title \
              --jq "map(select(.title == \"$ready\")) | .[0].number // empty")
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file issue.md
            else
              gh issue create --title "$ready" --body-file issue.md
            fi
          }
          # A branch of this month may hold edits made in review, so the
          # workflow leaves an existing branch as it is.
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
              echo "A PR for the branch $branch is open, and the workflow did not change the branch."
              exit 0
            fi
            echo "::warning::The branch $branch exists without an open PR, and the workflow did not change it."
            {
              echo "The citation sentence differs from Google Scholar. The branch \`$branch\` exists from an earlier run and has no open PR, so the workflow did not change it."
              echo
              echo "$link"
              echo
              echo "Delete the branch to let the next run prepare a new one."
              echo
              echo '```'
              cat report.txt
              echo '```'
              echo
              echo "Workflow run: $RUN_URL"
            } > issue.md
            report_branch
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add index.md
          git commit -m "$title"
          git push origin "$branch"
          {
            echo "Updates the numbers of the citation sentence on the home page. The quarterly workflow made this change, and nothing else in the file differs."
            echo
            echo "## Evidence"
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "The total and the count of CEDAR are rounded down to the multiple of 50 below the count, and the h-index is exact, as in PRs #99 and #109."
            echo
            echo "## Verification"
            echo
            echo "The diff is one line of \`index.md\`. The workflow did not build the site, and GitHub starts no other workflow for a branch that a workflow pushed. Build the site before the merge."
            echo
            echo "Workflow run: $RUN_URL"
          } > body.md
          if answer=$(gh pr create --base main --head "$branch" --title "$title" --body-file body.md 2>&1); then
            echo "$answer"
            exit 0
          fi
          echo "$answer"
          # Only the repository setting that stops a workflow from opening a PR
          # leads to the issue. Any other failure fails the run.
          if ! echo "$answer" | grep -qi "not permitted to create"; then
            echo "::error::The PR could not be opened, and the cause is not the repository setting."
            exit 1
          fi
          {
            echo "The quarterly workflow prepared a new citation sentence on the branch \`$branch\`. The repository does not let a workflow open a PR, so this issue stands in its place."
            echo
            echo "$link"
            echo
            cat body.md
          } > issue.md
          report_branch

      - name: Open a reminder or report an error
        if: steps.compare.outputs.outcome == 'refused' || steps.compare.outputs.outcome == 'lower' || steps.compare.outputs.outcome == 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.compare.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The backticks in the texts are Markdown and must not expand.
          # shellcheck disable=SC2016
          if [ "$OUTCOME" = "refused" ]; then
            issue="Citation refresh: due this quarter"
            intro='The quarterly refresh of the citation sentence is due. Google Scholar refused the request of the workflow, as it does for some requests from data centers, so the counts are read from a personal machine. Run `/refresh-citations` in Claude Code, or run `python3 .claude/skills/refresh-citations/scripts/refresh_citations.py` from the repository root.'
          elif [ "$OUTCOME" = "lower" ]; then
            issue="Citation refresh: Google Scholar gives a lower number"
            intro='Google Scholar gives a lower number than the site, so the workflow made no change. A lower count can be real, for example after Google Scholar merges two entries, or it can come from a wrong reading of the page. Compare the numbers with the profile, and lower the number on the site by hand if the count is real.'
          else
            issue="Citation refresh: the comparison could not run"
            intro='The quarterly comparison of the citation sentence with Google Scholar stopped with an error. The wording of the sentence or the layout of the profile page may have changed.'
          fi
          {
            echo "$intro"
            echo
            echo "The sentence now:"
            echo
            echo '```'
            git show HEAD:index.md | grep -o "over [0-9]* citations (h-index: [0-9]*), including CEDAR which has been cited more than [0-9]* times" || echo "The sentence was not found in index.md."
            echo '```'
            echo
            echo "Output of the run:"
            echo
            echo '```'
            cat report.txt error.txt
            echo '```'
            echo
            echo "Workflow run: $RUN_URL"
          } > issue.md
          number=$(gh issue list --state open --search "in:title \"$issue\"" --json number,title \
            --jq "map(select(.title == \"$issue\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue.md
          else
            gh issue create --title "$issue" --body-file issue.md
          fi

      - name: Fail the run when a person must act
        if: steps.compare.outputs.outcome == 'lower' || steps.compare.outputs.outcome == 'failed'
        run: exit 1
