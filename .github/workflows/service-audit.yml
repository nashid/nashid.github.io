name: Service audit

# Compares the committee roles on the researchr profile with
# _data/services.yml once a month. The workflow opens an issue when a role has
# no entry or when the audit cannot run. It commits nothing and opens no PR.

on:
  schedule:
    # 16:00 UTC on the first day of each month
    - cron: "0 16 1 * *"
  workflow_dispatch:
  # A change to the workflow or to the script runs the audit on the PR, with
  # the issue step skipped.
  pull_request:
    paths:
      - ".github/workflows/service-audit.yml"
      - ".claude/skills/audit-services/scripts/**"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run the audit
        id: audit
        run: |
          set +e
          python3 .claude/skills/audit-services/scripts/audit_researchr.py > report.txt 2> error.txt
          status=$?
          set -e
          cat report.txt
          cat error.txt >&2
          # A report without its summary line counts as a failure, so a change
          # in the report format cannot read as a clean month.
          if [ "$status" -ne 0 ] || ! grep -q '^Roles with no service entry: [0-9]' report.txt; then
            outcome=failed
          elif grep -q '^Roles with no service entry: 0$' report.txt && grep -q 'Unclassified lines: 0\.$' report.txt; then
            outcome=clean
          else
            outcome=review
          fi
          echo "Outcome: $outcome"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Report in an issue
        if: steps.audit.outputs.outcome != 'clean' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.audit.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The backticks in the two texts are Markdown and must not expand.
          # shellcheck disable=SC2016
          if [ "$OUTCOME" = "review" ]; then
            title="Service audit: committee roles to review"
            intro='The monthly audit found committee roles on the researchr profile with no entry in `_data/services.yml`, or lines that the script could not classify. Run `/audit-services` in Claude Code to add the roles, one PR for each.'
          else
            title="Service audit: the audit could not run"
            intro='The monthly audit of the researchr profile stopped with an error, so this month has no result. A change in the layout of the profile page is one possible cause.'
          fi
          {
            echo "$intro"
            echo
            echo '```'
            cat report.txt error.txt
            echo '```'
            echo
            echo "Workflow run: $RUN_URL"
          } > body.md
          # One open issue for each title. A later run adds a comment to it.
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi

      - name: Fail the run when the audit could not run
        if: steps.audit.outputs.outcome == 'failed'
        run: exit 1
